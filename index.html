<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes">
<title>Mears Power Path to Leadership</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#111}
.viewport{width:100%;height:100vh;overflow:auto;-webkit-overflow-scrolling:touch}
.wrap{position:relative;width:1536px;height:1024px;margin:0 auto;line-height:0}
.brochure{display:block;width:1536px;height:1024px}
.hotspot{position:absolute;display:block;z-index:20;border-radius:10px;cursor:pointer}
.hotspot:hover{background:rgba(255,255,255,.03)}
@media(min-width:900px){
  .viewport{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100vw;
    height:100dvh;
    overflow:auto;
  }
  .wrap{
    position:relative;
    width:min(100vw,150dvh);
    height:auto;
    aspect-ratio:3/2;
    margin:auto;
  }
  .brochure{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
  }
}

/* PHONE - PORTRAIT: fit the whole brochure to the phone width */
@media(max-width:899px) and (orientation:portrait){
  html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    background:#111;
  }
  .viewport{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    width:100vw;
    min-height:100dvh;
    overflow:visible;
  }
  .wrap{
    position:relative;
    width:100vw;
    height:auto;
    aspect-ratio:3/2;
    margin:0 auto;
  }
  .brochure{
    display:block;
    width:100%;
    height:auto;
  }
}

/* PHONE - LANDSCAPE: fit by available SCREEN HEIGHT, centered horizontally */
@media(max-width:899px) and (orientation:landscape){
  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:auto;
    background:#111;
  }
  .viewport{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100vw;
    height:100dvh;
    min-height:100dvh;
    overflow:auto;
  }
  .wrap{
    position:relative;
    height:100dvh;
    width:min(100vw,150dvh);
    aspect-ratio:3/2;
    margin:auto;
    flex:0 0 auto;
  }
  .brochure{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
  }
}

/* No custom zoom UI. Browser/native pinch zoom only. */
</style>
</head>

<script>
(function () {
  function refreshViewportAfterRotate() {
    document.documentElement.style.setProperty('--vh', window.innerHeight + 'px');
    window.scrollTo(0, 0);
  }
  window.addEventListener('orientationchange', function () {
    setTimeout(refreshViewportAfterRotate, 150);
    setTimeout(refreshViewportAfterRotate, 450);
  });
  window.addEventListener('resize', refreshViewportAfterRotate);
  refreshViewportAfterRotate();
})();
</script>
