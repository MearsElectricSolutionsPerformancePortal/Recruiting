<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mears Power Path to Leadership</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .page {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brochure-wrap {
      position: relative;

      /* Brochure dimensions are 1536 x 1024 = 3:2 */
      width: min(100vw, 150vh);
      aspect-ratio: 3 / 2;

      line-height: 0;
    }

    .brochure {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .hotspot {
      position: absolute;
      display: block;
      z-index: 10;
      cursor: pointer;
      border-radius: 10px;
      outline: none;
    }

    .hotspot:hover {
      background: rgba(255, 255, 255, 0.06);
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.35);
    }

    .hotspot:focus-visible {
      box-shadow:
        inset 0 0 0 4px #ffffff,
        0 0 0 4px #f58220;
    }

    @media (max-width: 700px) {
      body {
        overflow: auto;
        align-items: flex-start;
      }

      .page {
        min-height: 100vh;
        height: auto;
      }

      .brochure-wrap {
        width: 100vw;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="brochure-wrap">

      <img
        class="brochure"
        src="PowerPath_to_Leadership_career_brochure.png"
        alt="Mears Electric Solutions Power Path to Leadership career brochure showing Operations, Project Management, Safety, and Estimating career paths. Underlined positions can be selected to view job descriptions."
      >


      <!-- LABORER -->
      <a
        class="hotspot"
        href="job-descriptions/laborer/"
        aria-label="Laborer job description"
        title="View Laborer job description"
        style="
          left:1.5625%;
          top:44.1406%;
          width:6.7708%;
          height:11.5234%;

      </a>

    </div>

</body>
</html>
